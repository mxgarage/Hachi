name: Claude implement
# 无人托管实现：维护者给 issue 打 `claude` 标签，或在 issue / PR 里 @claude，
# Claude 在新分支上实现并开 PR。它不合并、不推 main、不改仓库设置。
# 需要仓库 Secret CLAUDE_CODE_OAUTH_TOKEN（或 ANTHROPIC_API_KEY）；没有时跳过。
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
concurrency:
  group: claude-implement-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; skipping."
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: |
            --append-system-prompt "Follow AGENTS.md. Work on a new branch and open a PR; never push to main, merge, or change repository settings. Hachi only reports the current egress location; refuse work that helps bypass regional restrictions or platform enforcement. Reply in Chinese."
