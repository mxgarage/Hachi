name: Release
# 只由维护者推 tag 触发；代理不打 tag、不发布（AGENTS.md）。
# tag 格式：v<CFBundleShortVersionString>，例如 v0.2。
#   带后缀（v0.2-dev.1、v0.3-rc.1）→ 预发布，标明“未通过发布门槛”，发布门槛不满足也能发。
#   不带后缀（v0.2）→ 正式发布，必须 `tests/acceptance.py --require-gate` 通过，否则失败、不发布。
# 产物为 ad-hoc 签名（未经 Apple 公证）的 Hachi.app zip，附 SHA-256 和验收报告。
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(python3 -c "import re;print(re.search(r\"CFBundleShortVersionString='([^']+)'\", open('build.py').read()).group(1))")
          base="${tag#v}"; base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $tag does not match CFBundleShortVersionString $version"; exit 1
          fi
          if [ "$tag" = "v$version" ]; then echo "prerelease=false" >> "$GITHUB_OUTPUT"; else echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi
      - name: Acceptance (stable release requires the full gate)
        run: |
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            python3 tests/acceptance.py
          else
            python3 tests/acceptance.py --require-gate
          fi
      - name: Sign (ad-hoc) and package
        run: |
          codesign --force --deep --sign - build/Hachi.app
          codesign --verify --deep --strict build/Hachi.app
          zip="build/Hachi-${GITHUB_REF_NAME}-macos.zip"
          ditto -c -k --keepParent build/Hachi.app "$zip"
          (cd build && shasum -a 256 "$(basename "$zip")" > "$(basename "$zip").sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
              echo "> **开发预发布，未通过发布门槛。** 只用于试用和测试，不代表 README 中的发布条件已满足。"
              echo
            fi
            echo "ad-hoc 签名，未经 Apple 公证：首次打开需在 Finder 里右键 → 打开。Hachi 只提醒当前的网络出口位置，不改变平台账号资格，也不帮人绕开地区限制。"
            echo
            cat build/acceptance/report.md
          } > build/release-notes.md
          flags=()
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Hachi $GITHUB_REF_NAME" \
            --notes-file build/release-notes.md "${flags[@]}" \
            build/Hachi-*-macos.zip build/Hachi-*-macos.zip.sha256
