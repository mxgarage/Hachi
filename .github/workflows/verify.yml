name: Account-free macOS verification
# PR 和 main 各跑一次即可：同一次分支推送不再在 push 和 pull_request 上重复跑 macOS job（docs/orchestration.md）。
# 没开 PR 的分支可以在 Actions 页面手动运行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # 同一个 PR 连续推送时取消旧的运行；main 和手动运行按提交各自跑完。
  group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  loopback:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate evidence is checked against git history
      # evidence/ is maintainer-only (AGENTS.md). Agent branches or agent-authored commits that touch it fail.
      # Changes to the gate definition or automation (release-gate.json, tests/acceptance.py, tests/gate_selftest.py,
      # .github/workflows/, .github/scripts/) and to the UX screenshot baseline (tests/ux-baseline/) by agents are
      # flagged as a warning in the job summary for the maintainer to review (they may legitimately change, e.g. this
      # tooling's own PRs). Runs on pull_request only; direct pushes are not covered.
      # This catches honest mistakes; it cannot stop someone who rewrites branch names and trailers.
      - name: Evidence is maintainer-only
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- evidence/ ':(exclude)evidence/README.md')
          gate=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- release-gate.json tests/acceptance.py tests/gate_selftest.py .github/workflows/ .github/scripts/ AGENTS.md evidence/README.md)
          ux=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- tests/ux-baseline/ ':(exclude)tests/ux-baseline/README.md')
          [ -z "$changed$gate$ux" ] && exit 0
          why=""
          case "$HEAD_REF" in claude/*|codex/*|muse/*) why="agent branch $HEAD_REF";; esac
          msgs=$(git log --format=%B "$BASE_SHA..$HEAD_SHA")
          if grep -qiE '^(co-authored-by: .*(claude|codex|anthropic|openai)|claude-session:)' <<<"$msgs"; then
            why="$why agent-authored commits"
          fi
          [ -z "$why" ] && exit 0
          if [ -n "$gate" ]; then
            echo "::warning::gate definition changed by ($why); maintainer must check it does not loosen the gate: $(echo $gate)"
            { echo "### ⚠️ 门槛定义被代理改动，合并前请确认没有放宽条件"; echo "$gate" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ux" ]; then
            echo "::warning::UX screenshot baseline changed by ($why); the maintainer must look at the diff images before merging (AGENTS.md)"
            { echo "### ⚠️ 代理改了截图基线，合并前请维护者本人看差异图（PR 正文应逐个列出变了的截图）"; echo "$ux" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$changed" ]; then
            echo "::error::evidence/ changed by ($why). Only the maintainer commits evidence (AGENTS.md):"; echo "$changed"; exit 1
          fi
      # Builds, runs tests/lab.py and tests/branding.py, self-tests the gate, checks repo hygiene,
      # and evaluates the release gate (reported in the job summary; not met is expected for now).
      - run: python3 tests/acceptance.py
      - name: Package app
        if: always()
        run: |
          if [ -d build/Hachi.app ]; then
            ditto -c -k --keepParent build/Hachi.app build/Hachi-${GITHUB_SHA::7}-unsigned.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hachi-${{ github.sha }}
          path: |
            build/Hachi-*-unsigned.zip
            build/acceptance/
          if-no-files-found: warn
          retention-days: 14
  # The release ships one universal app. Build it and launch it on both Apple silicon and Intel on every PR, so a change
  # that breaks one architecture is caught here and not at release time. (UX screenshots stay on the single job above:
  # they are pixel-exact and the baseline comes from one runner type.)
  launch:
    name: launch on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 build.py
          codesign --force --deep --sign - build/Hachi.app
          python3 tests/verify_package.py build/Hachi.app --archs arm64,x86_64
